<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha CRM Corretor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2335;--bg4:#252a3d;
  --accent:#4f8ef7;--accent2:#7c5cfc;--green:#22c77a;--amber:#f59e0b;--red:#ef4444;--pink:#ec4899;--teal:#14b8a6;
  --text:#e8ecf4;--text2:#8891aa;--text3:#555e7a;--border:#2a3050;--radius:12px;--radius-sm:8px;
}
html,body{min-height:100%;font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
body{display:flex;justify-content:center}
.app{display:flex;flex-direction:column;min-height:100vh;width:100%;max-width:480px;background:var(--bg)}

.topbar{background:var(--bg2);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.topbar-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.topbar-info{flex:1}
.topbar-title{font-size:13px;font-weight:600}
.topbar-sub{font-size:10px;color:var(--text2);font-family:'JetBrains Mono',monospace}
.topbar-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.topbar-btn:hover{background:var(--bg3);color:var(--text)}

.global-search{background:var(--bg2);padding:10px 14px;border-bottom:1px solid var(--border);display:none}
.global-search.open{display:block}
.search-wrap{position:relative}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px 9px 36px;color:var(--text);font-size:13px;font-family:'Sora',sans-serif;outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none}

.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 4px;position:sticky;top:54px;z-index:199}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:10px 11px;font-size:11px;font-weight:500;color:var(--text2);border:none;background:transparent;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;font-family:'Sora',sans-serif;display:flex;align-items:center;gap:4px}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-btn i{font-size:14px}

.content{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:80px}
.tab{display:none}.tab.active{display:flex;flex-direction:column;gap:12px}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title-left{display:flex;align-items:center;gap:6px}
.card-title i{font-size:14px}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg3);border-radius:var(--radius-sm);padding:10px;border:1px solid var(--border);text-align:center}
.kpi-val{font-size:20px;font-weight:600;font-family:'JetBrains Mono',monospace;line-height:1}
.kpi-label{font-size:10px;color:var(--text2);margin-top:3px}
.kpi.accent .kpi-val{color:var(--accent)}.kpi.green .kpi-val{color:var(--green)}
.kpi.amber .kpi-val{color:var(--amber)}.kpi.red .kpi-val{color:var(--red)}
.kpi.pink .kpi-val{color:var(--pink)}.kpi.teal .kpi-val{color:var(--teal)}

.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.badge.novo{background:#1a2a4a;color:#4fc3f7}
.badge.quente{background:#3a1a14;color:#ff6b6b}
.badge.neg{background:#2d2a14;color:var(--amber)}
.badge.ganho{background:#142d1e;color:var(--green)}
.badge.perdido{background:#2d1414;color:var(--red)}
.badge.ativo{background:#1a3a4a;color:#4fc3f7}
.badge.pendente{background:#2a1f3a;color:var(--accent2)}

.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap;font-family:'Sora',sans-serif;transition:all .2s}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.tag.quente{background:#3a1a14;color:#ff6b6b}
.tag.investidor{background:#1a2a3a;color:var(--accent)}
.tag.primeira{background:#142d1e;color:var(--green)}
.tag.financ{background:#2d2a14;color:var(--amber)}
.tag.permuta{background:#2a1f3a;color:var(--accent2)}
.tag.urgente{background:#3a1414;color:var(--red)}
.tag.alto{background:#1a1a3a;color:#c084fc}
.tag.sem-resp{background:#2a2a2a;color:var(--text2)}
.tag.terreno{background:#142a1e;color:var(--teal)}
.tag.casa{background:#1a2d14;color:#86efac}

.lead-item{background:var(--bg3);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);transition:border-color .2s;cursor:pointer}
.lead-item:hover{border-color:var(--accent)}
.lead-top{display:flex;align-items:flex-start;gap:10px}
.lead-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.lead-info{flex:1;min-width:0}
.lead-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-detail{font-size:11px;color:var(--text2);margin-top:2px}
.lead-actions{display:flex;gap:4px;flex-shrink:0}
.btn-icon{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;text-decoration:none}
.btn-icon:hover{background:var(--bg4);color:var(--text)}
.btn-icon.del:hover{background:#2d1414;color:var(--red);border-color:var(--red)}
.btn-icon.edit:hover{background:#0f2a3a;color:var(--accent);border-color:var(--accent)}
.btn-icon.wa{background:#142d1e;color:var(--green);border-color:#1e5c3a}
.btn-icon.wa:hover{background:#1e4a2a}

.followup-alert{background:#2d2a14;border:1px solid #5c4a14;border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.followup-alert i{color:var(--amber);font-size:18px;flex-shrink:0}
.followup-alert-text{flex:1}
.followup-alert-title{font-size:12px;font-weight:600;color:var(--amber)}
.followup-alert-sub{font-size:11px;color:var(--text2);margin-top:1px}

.funil{display:flex;flex-direction:column;gap:5px}
.funil-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.funil-label{font-size:11px;color:var(--text2);width:110px;flex-shrink:0}
.funil-bar-wrap{flex:1;background:var(--bg4);border-radius:4px;height:20px;overflow:hidden}
.funil-bar{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--bg)}

.emp-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:border-color .2s}
.emp-card:hover{border-color:var(--accent)}
.emp-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.emp-name{font-size:13px;font-weight:600}
.emp-tipo{font-size:10px;color:var(--text2);margin-top:2px}
.emp-stats{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.emp-stat{flex:1;text-align:center}
.emp-stat-val{font-size:16px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--accent)}
.emp-stat-label{font-size:10px;color:var(--text2);margin-top:1px}

.match-card{background:var(--bg3);border:1px solid var(--green);border-radius:var(--radius-sm);padding:10px 12px}
.match-title{font-size:11px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px;margin-bottom:8px}
.match-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.match-item:last-child{border:none}

.origem-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.orig-ig{background:#3a1a2a;color:#f472b6}
.orig-fb{background:#1a2a4a;color:#60a5fa}
.orig-wa{background:#142d1e;color:#4ade80}
.orig-ind{background:#2d2a14;color:#fbbf24}
.orig-site{background:#1a1a3a;color:#a78bfa}
.orig-portal{background:#1a2a3a;color:#38bdf8}
.orig-ads{background:#2d1a14;color:#fb923c}
.orig-olx{background:#2a1a14;color:#f97316}
.orig-org{background:#142a1a;color:#34d399}

.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(79,142,247,.45);z-index:300;transition:transform .2s}
.fab:hover{transform:scale(1.08)}
@media(min-width:480px){.fab{right:calc(50% - 220px)}}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:400;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-top:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:transparent;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}

.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;font-family:'Sora',sans-serif;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-select option{background:var(--bg3)}
.form-textarea{resize:vertical;min-height:65px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-section{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}

.tag-picker{display:flex;flex-wrap:wrap;gap:6px}
.tag-opt{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .2s;font-family:'Sora',sans-serif}
.tag-opt.selected{border-color:var(--accent);color:var(--accent);background:#0f2a4a}

.btn-primary{width:100%;padding:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;margin-top:4px;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{width:100%;padding:9px;background:transparent;border:1px solid var(--red);border-radius:var(--radius-sm);color:var(--red);font-size:13px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-danger:hover{background:#2d1414}

.detail-view{display:none;flex-direction:column;gap:12px}
.detail-view.open{display:flex}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;padding:4px 0}
.back-btn i{font-size:16px}
.detail-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.detail-field{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.detail-field:last-child{border:none}
.detail-field-label{color:var(--text2);flex-shrink:0;margin-right:12px}
.detail-field-val{text-align:right;font-weight:500}

.msg-template{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.msg-template:hover{border-color:var(--accent)}
.msg-template-title{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px}
.msg-template-body{font-size:11px;color:var(--text2);line-height:1.5}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:28px}
.loading-title{font-size:16px;font-weight:600}
.loading-sub{font-size:12px;color:var(--text2)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sync-indicator{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);padding:2px 0}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.empty{text-align:center;padding:28px 20px;color:var(--text3);font-size:12px}
.empty i{font-size:30px;display:block;margin-bottom:8px}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 18px;font-size:12px;font-weight:600;color:var(--text);z-index:500;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.warn{border-color:var(--amber);color:var(--amber)}

@media(min-width:600px) and (max-width:899px){body{padding:20px}.app{border-radius:16px;min-height:auto;box-shadow:0 0 0 1px var(--border)}}
@media(min-width:900px){
  html,body{height:100%;overflow:hidden}
  body{padding:0;background:var(--bg)}
  .app{flex-direction:row;max-width:100%;height:100vh}
  /* hide mobile topbar and nav on desktop */
  .topbar{display:none}
  .nav{display:none}
  .global-search{display:none!important}
  /* SIDEBAR */
  .sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;position:sticky;top:0}
  .sidebar-logo{padding:20px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
  .sidebar-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .sidebar-logo-title{font-size:13px;font-weight:600}
  .sidebar-logo-sub{font-size:10px;color:var(--text2);font-family:'JetBrains Mono',monospace}
  .sidebar-nav{display:flex;flex-direction:column;padding:10px 8px;gap:2px;flex:1}
  .sidebar-nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);border:none;background:transparent;cursor:pointer;text-align:left;width:100%;font-family:'Sora',sans-serif;transition:all .2s}
  .sidebar-nav-btn i{font-size:18px;flex-shrink:0}
  .sidebar-nav-btn:hover{background:var(--bg3);color:var(--text)}
  .sidebar-nav-btn.active{background:var(--bg3);color:var(--accent);font-weight:600}
  .sidebar-search{margin:0 8px 8px;position:relative}
  .sidebar-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;color:var(--text);font-size:12px;font-family:'Sora',sans-serif;outline:none}
  .sidebar-search input:focus{border-color:var(--accent)}
  .sidebar-search input::placeholder{color:var(--text3)}
  .sidebar-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
  .sidebar-search-results{position:absolute;bottom:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;max-height:300px;overflow-y:auto;z-index:50;display:none}
  .sidebar-search-results.open{display:block}
  .sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3)}
  /* MAIN AREA */
  .main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .desktop-header{background:var(--bg2);padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .desktop-header-title{font-size:16px;font-weight:600}
  .desktop-header-date{font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace}
  .content{padding:24px;overflow-y:auto;height:calc(100vh - 57px);padding-bottom:24px}
  .tab{gap:16px}
  .kpi-grid{grid-template-columns:repeat(6,1fr);gap:12px}
  .kpi-val{font-size:24px}
  .kpi-label{font-size:11px}
  .leads-grid-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .emp-grid-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .fab{display:none}
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loading-screen">
  <div class="loading-logo">🏠</div>
  <div class="loading-title">CRM Corretor</div>
  <div class="spinner"></div>
  <div class="loading-sub" id="loading-msg">Conectando ao banco de dados...</div>
</div>

<div class="app" id="main-app" style="display:none">

  <!-- DESKTOP SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🏠</div>
      <div>
        <div class="sidebar-logo-title">CRM Corretor</div>
        <div class="sidebar-logo-sub" id="sidebar-date"></div>
      </div>
    </div>
    <div style="padding:10px 8px 4px">
      <div class="sidebar-search">
        <i class="ti ti-search sidebar-search-icon"></i>
        <input type="text" placeholder="Buscar lead..." oninput="globalSearch(this.value);document.getElementById('sidebar-results').classList.toggle('open',this.value.length>1)">
        <div class="sidebar-search-results" id="sidebar-results"></div>
      </div>
    </div>
    <div class="sidebar-nav">
      <button class="sidebar-nav-btn active" onclick="showTab('dashboard',this)"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
      <button class="sidebar-nav-btn" onclick="showTab('leads',this)"><i class="ti ti-users"></i> Leads</button>
      <button class="sidebar-nav-btn" onclick="showTab('empreend',this)"><i class="ti ti-building-estate"></i> Produtos</button>
      <button class="sidebar-nav-btn" onclick="showTab('followup',this)"><i class="ti ti-bell"></i> Follow-up</button>
      <button class="sidebar-nav-btn" onclick="showTab('msgs',this)"><i class="ti ti-message-2"></i> Mensagens</button>
    </div>
    <div class="sidebar-footer">
      <div class="sync-dot" id="sync-dot2"></div>
      <span id="sync-text2">online</span>
      <span style="margin-left:auto;cursor:pointer;color:var(--accent)" onclick="openAddModal()"><i class="ti ti-plus" style="font-size:16px"></i> Novo</span>
    </div>
  </div>

async function sbGet(table) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?select=*&order=created_at.asc`, {headers: HEADERS});
  if (!r.ok) throw new Error(await r.text());
  const rows = await r.json();
  return rows.map(row => ({id: row.id, ...row.data}));
}

async function sbUpsert(table, obj) {
  const {id, ...rest} = obj;
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {...HEADERS, 'Prefer': 'resolution=merge-duplicates,return=representation'},
    body: JSON.stringify({id, data: {...rest}})
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbDelete(table, id) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'DELETE', headers: HEADERS
  });
  if (!r.ok) throw new Error(await r.text());
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0]}
function daysSince(d){if(!d)return 99;return Math.floor((new Date()-new Date(d))/(864e5))}
function fd(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function fmtTel(t){const d=(t||'').replace(/\D/g,'');if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return t}
function ini(n){return(n||'?').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function avc(n){const c=['#4f8ef7','#22c77a','#7c5cfc','#f59e0b','#ef4444','#14b8a6','#ec4899'];return c[(n||'A').charCodeAt(0)%c.length]}
function val(id){return(document.getElementById(id)||{}).value||''}
function valt(id){return((document.getElementById(id)||{}).value||'').trim()}
function selOpts(arr,cur){return arr.map(o=>`<option${cur===o?' selected':''}>${o}</option>`).join('')}
function waLink(tel){const d=(tel||'').replace(/\D/g,'');const n=d.startsWith('55')?d:'55'+d;return`https://wa.me/${n}`}
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',2500)}

}

async function quickContato(id){
  const l=DB.leads.find(x=>x.id===id);if(!l)return;
  l.ultimoContato=new Date().toISOString().split('T')[0];
  const c={id:uid(),leadId:id,tipo:'Contato Rápido',data:l.ultimoContato,obs:'Marcado via follow-up.'};
  DB.contatos.push(c);
  setSyncStatus('syncing');
  try{await sbUpsert('leads',l);await sbUpsert('contatos',c);setSyncStatus('ok');}
  catch(e){saveLocal();setSyncStatus('error');}
  renderAll();toast('Contato registrado!');
}

async function saveContato(leadId){
  const l=DB.leads.find(x=>x.id===leadId);if(!l)return;
  const btn=document.getElementById('save-contato-btn');
  if(btn)btn.disabled=true;
  const dt=val('cdt')||new Date().toISOString().split('T')[0];
  const novaEtapa=val('ceta');
  const c={id:uid(),leadId,tipo:val('ctp'),data:dt,obs:valt('cob')};
  DB.contatos.push(c);
  l.ultimoContato=dt;
  if(novaEtapa!=='(manter atual)')l.etapa=novaEtapa;
  setSyncStatus('syncing');
  try{await sbUpsert('contatos',c);await sbUpsert('leads',l);setSyncStatus('ok');toast('Contato salvo na nuvem!');}
  catch(e){saveLocal();setSyncStatus('error');toast('Salvo localmente (offline)','warn');}

  setTimeout(()=>openLeadDetail(leadId),100);
}

async function saveLead(){
  const nome=valt('fn'),tel=valt('ft');
  if(!nome||!tel){toast('Preencha nome e telefone','error');return}
  const btn=document.getElementById('save-lead-btn');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  const tags=[...document.querySelectorAll('.tag-opt.selected')].map(b=>b.textContent.trim());
  const obj={nome,tel,email:valt('fe'),cidade:valt('fci'),categoria:val('fcat'),empId:val('femp'),vlMin:+val('fvmin')||0,vlMax:+val('fvmax')||0,origem:val('for'),etapa:val('fet'),origemDetalhe:valt('fod'),obs:valt('fob'),tags,ultimoContato:new Date().toISOString().split('T')[0]};
  if(editId){
    const i=DB.leads.findIndex(x=>x.id===editId);
    DB.leads[i]={...DB.leads[i],...obj};
    setSyncStatus('syncing');
    try{await sbUpsert('leads',DB.leads[i]);setSyncStatus('ok');toast('Lead atualizado!');}
    catch(e){saveLocal();setSyncStatus('error');toast('Salvo localmente','warn');}
  } else {
    const novo={id:uid(),...obj};
    DB.leads.push(novo);
    setSyncStatus('syncing');
    try{await sbUpsert('leads',novo);setSyncStatus('ok');toast('Lead salvo na nuvem! ☁️');}
    catch(e){saveLocal();setSyncStatus('error');toast('Salvo localmente','warn');}
  }
  closeModal();renderAll();
}
function editLead(id){openLeadForm(id)}
async function delLead(id,fromModal=false){
  if(!confirm('Excluir este lead?'))return;
  DB.leads=DB.leads.filter(x=>x.id!==id);
  DB.contatos=DB.contatos.filter(c=>c.leadId!==id);
  setSyncStatus('syncing');
  try{await sbDelete('leads',id);setSyncStatus('ok');}
  catch(e){saveLocal();setSyncStatus('error');}
  if(fromModal)closeModal();
  closeLeadDetail();renderAll();toast('Lead excluído');
}

// ─── EMP FORM ─────────────────────────────────────────────────────────────────
function openEmpForm(id){
  editId=id||null;const e=id?DB.empreendimentos.find(x=>x.id===id):{};
  openModal(id?'Editar Produto':'Novo Produto',`
    <div class="form-group"><label class="form-label">Nome *</label><input class="form-input" id="en" value="${e.nome||''}" placeholder="Ex: Lagos do Engenho"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Tipo</label><select class="form-select" id="et">${selOpts(CATEGORIAS,e.tipo)}</select></div>
      <div class="form-group"><label class="form-label">Cidade</label><input class="form-input" id="ec" value="${e.cidade||''}" placeholder="Cidade"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Valor mín (R$)</label><input class="form-input" id="evm" type="number" value="${e.vlMin||''}"></div>
      <div class="form-group"><label class="form-label">Valor máx (R$)</label><input class="form-input" id="evx" type="number" value="${e.vlMax||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Descrição</label><textarea class="form-textarea" id="ed">${e.descricao||''}</textarea></div>
    <button class="btn-primary" id="save-emp-btn" onclick="saveEmp()">${id?'Salvar':'Adicionar produto'}</button>
    ${id?`<button class="btn-danger" onclick="delEmp('${id}',true)">Excluir produto</button>`:''}`);
}
async function saveEmp(){
  const nome=valt('en');if(!nome){toast('Informe o nome','error');return}
  const btn=document.getElementById('save-emp-btn');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  const obj={nome,tipo:val('et'),cidade:valt('ec'),vlMin:+val('evm')||0,vlMax:+val('evx')||0,descricao:valt('ed')};
  if(editId){
    const i=DB.empreendimentos.findIndex(x=>x.id===editId);
    DB.empreendimentos[i]={...DB.empreendimentos[i],...obj};
    try{await sbUpsert('empreendimentos',DB.empreendimentos[i]);setSyncStatus('ok');toast('Produto atualizado!');}
    catch(e){saveLocal();setSyncStatus('error');toast('Salvo localmente','warn');}
  } else {
    const novo={id:uid(),...obj};
    DB.empreendimentos.push(novo);
    try{await sbUpsert('empreendimentos',novo);setSyncStatus('ok');toast('Produto salvo na nuvem! ☁️');}
    catch(e){saveLocal();setSyncStatus('error');toast('Salvo localmente','warn');}
  }
  closeModal();renderAll();
}
function editEmp(id){openEmpForm(id)}
async function delEmp(id,fromModal=false){
  if(!confirm('Excluir este produto?'))return;
  DB.empreendimentos=DB.empreendimentos.filter(x=>x.id!==id);
  try{await sbDelete('empreendimentos',id);setSyncStatus('ok');}
  catch(e){saveLocal();setSyncStatus('error');}
  if(fromModal)closeModal();closeEmpDetail();renderAll();toast('Produto excluído');
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openModal(title,html){document.getElementById('modal-title-text').textContent=title;document.getElementById('modal-body').innerHTML=html;document.getElementById('overlay').classList.add('open')}
function closeModal(){document.getElementById('overlay').classList.remove('open');editId=null}
function handleOC(e){if(e.target===document.getElementById('overlay'))closeModal()}
function openAddModal(){if(curTab==='empreend')openEmpForm();else openLeadForm()}

function renderAll(){renderDashboard();renderLeads();renderEmpreendimentos();renderFollowup();renderMsgs()}

// ─── INIT ─────────────────────────────────────────────────────────────────────
const _dateStr=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
['today-date','sidebar-date','desktop-date'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=_dateStr;});

(async()=>{
  await loadFromCloud();
  renderAll();
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('main-app').style.display='flex';
})();
</script>
