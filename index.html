<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha CRM Corretor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2335;--bg4:#252a3d;
  --accent:#4f8ef7;--accent2:#7c5cfc;--green:#22c77a;--amber:#f59e0b;--red:#ef4444;--pink:#ec4899;--teal:#14b8a6;
  --text:#e8ecf4;--text2:#8891aa;--text3:#555e7a;--border:#2a3050;--radius:12px;--radius-sm:8px;
}
html,body{min-height:100%;font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
body{display:flex;justify-content:center}
.app{display:flex;flex-direction:column;min-height:100vh;width:100%;max-width:480px;background:var(--bg)}

/* TOPBAR */
.topbar{background:var(--bg2);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.topbar-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.topbar-info{flex:1}
.topbar-title{font-size:13px;font-weight:600}
.topbar-sub{font-size:10px;color:var(--text2);font-family:'JetBrains Mono',monospace}
.topbar-search{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.topbar-search:hover{background:var(--bg3);color:var(--text)}

/* GLOBAL SEARCH BAR */
.global-search{background:var(--bg2);padding:10px 14px;border-bottom:1px solid var(--border);display:none}
.global-search.open{display:block}
.search-wrap{position:relative}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px 9px 36px;color:var(--text);font-size:13px;font-family:'Sora',sans-serif;outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none}

/* NAV */
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 4px;position:sticky;top:54px;z-index:199}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:10px 11px;font-size:11px;font-weight:500;color:var(--text2);border:none;background:transparent;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;font-family:'Sora',sans-serif;display:flex;align-items:center;gap:4px}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-btn i{font-size:14px}

/* CONTENT */
.content{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:80px}
.tab{display:none}.tab.active{display:flex;flex-direction:column;gap:12px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title-left{display:flex;align-items:center;gap:6px}
.card-title i{font-size:14px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg3);border-radius:var(--radius-sm);padding:10px;border:1px solid var(--border);text-align:center}
.kpi-val{font-size:20px;font-weight:600;font-family:'JetBrains Mono',monospace;line-height:1}
.kpi-label{font-size:10px;color:var(--text2);margin-top:3px}
.kpi.accent .kpi-val{color:var(--accent)}.kpi.green .kpi-val{color:var(--green)}
.kpi.amber .kpi-val{color:var(--amber)}.kpi.red .kpi-val{color:var(--red)}
.kpi.pink .kpi-val{color:var(--pink)}.kpi.teal .kpi-val{color:var(--teal)}

/* BADGES */
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.badge.novo{background:#1a2a4a;color:#4fc3f7}
.badge.quente{background:#3a1a14;color:#ff6b6b}
.badge.frio{background:#1a1a3a;color:var(--accent2)}
.badge.neg{background:#2d2a14;color:var(--amber)}
.badge.ganho{background:#142d1e;color:var(--green)}
.badge.perdido{background:#2d1414;color:var(--red)}
.badge.ativo{background:#1a3a4a;color:#4fc3f7}
.badge.pendente{background:#2a1f3a;color:var(--accent2)}

/* PILLS */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap;font-family:'Sora',sans-serif;transition:all .2s}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;cursor:pointer}
.tag.quente{background:#3a1a14;color:#ff6b6b}
.tag.investidor{background:#1a2a3a;color:var(--accent)}
.tag.primeira{background:#142d1e;color:var(--green)}
.tag.financ{background:#2d2a14;color:var(--amber)}
.tag.permuta{background:#2a1f3a;color:var(--accent2)}
.tag.urgente{background:#3a1414;color:var(--red)}
.tag.alto{background:#1a1a3a;color:#c084fc}
.tag.sem-resp{background:#2a2a2a;color:var(--text2)}
.tag.terreno{background:#142a1e;color:var(--teal)}
.tag.casa{background:#1a2d14;color:#86efac}

/* LIST ITEMS */
.lead-item{background:var(--bg3);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);transition:border-color .2s;cursor:pointer}
.lead-item:hover{border-color:var(--accent)}
.lead-top{display:flex;align-items:flex-start;gap:10px}
.lead-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.lead-info{flex:1;min-width:0}
.lead-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-detail{font-size:11px;color:var(--text2);margin-top:2px}
.lead-actions{display:flex;gap:4px;flex-shrink:0}
.btn-icon{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;text-decoration:none}
.btn-icon:hover{background:var(--bg4);color:var(--text)}
.btn-icon.del:hover{background:#2d1414;color:var(--red);border-color:var(--red)}
.btn-icon.edit:hover{background:#0f2a3a;color:var(--accent);border-color:var(--accent)}
.btn-icon.wa{background:#142d1e;color:var(--green);border-color:#1e5c3a}
.btn-icon.wa:hover{background:#1e4a2a}

/* FOLLOWUP ALERT */
.followup-alert{background:#2d2a14;border:1px solid #5c4a14;border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px}
.followup-alert i{color:var(--amber);font-size:18px;flex-shrink:0}
.followup-alert-text{flex:1}
.followup-alert-title{font-size:12px;font-weight:600;color:var(--amber)}
.followup-alert-sub{font-size:11px;color:var(--text2);margin-top:1px}

/* FUNIL */
.funil{display:flex;flex-direction:column;gap:5px}
.funil-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.funil-row:hover .funil-label{color:var(--text)}
.funil-label{font-size:11px;color:var(--text2);width:110px;flex-shrink:0;transition:color .2s}
.funil-bar-wrap{flex:1;background:var(--bg4);border-radius:4px;height:20px;overflow:hidden}
.funil-bar{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--bg)}

/* EMPREENDIMENTOS */
.emp-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:border-color .2s}
.emp-card:hover{border-color:var(--accent)}
.emp-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.emp-name{font-size:13px;font-weight:600}
.emp-tipo{font-size:10px;color:var(--text2);margin-top:2px}
.emp-stats{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.emp-stat{flex:1;text-align:center}
.emp-stat-val{font-size:16px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--accent)}
.emp-stat-label{font-size:10px;color:var(--text2);margin-top:1px}

/* MATCH CARD */
.match-card{background:var(--bg3);border:1px solid var(--green);border-radius:var(--radius-sm);padding:10px 12px}
.match-title{font-size:11px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px;margin-bottom:8px}
.match-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.match-item:last-child{border:none}

/* ORIGEM BADGE */
.origem-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.orig-ig{background:#3a1a2a;color:#f472b6}
.orig-fb{background:#1a2a4a;color:#60a5fa}
.orig-wa{background:#142d1e;color:#4ade80}
.orig-ind{background:#2d2a14;color:#fbbf24}
.orig-site{background:#1a1a3a;color:#a78bfa}
.orig-portal{background:#1a2a3a;color:#38bdf8}
.orig-ads{background:#2d1a14;color:#fb923c}
.orig-olx{background:#2a1a14;color:#f97316}
.orig-org{background:#142a1a;color:#34d399}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(79,142,247,.45);z-index:300;transition:transform .2s}
.fab:hover{transform:scale(1.08)}
@media(min-width:480px){.fab{right:calc(50% - 220px)}}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:400;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-top:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:transparent;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}

/* FORM */
.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;font-family:'Sora',sans-serif;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-select option{background:var(--bg3)}
.form-textarea{resize:vertical;min-height:65px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-section{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}

/* TAG PICKER */
.tag-picker{display:flex;flex-wrap:wrap;gap:6px}
.tag-opt{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .2s;font-family:'Sora',sans-serif}
.tag-opt.selected{border-color:var(--accent);color:var(--accent);background:#0f2a4a}

.btn-primary{width:100%;padding:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;margin-top:4px;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-danger{width:100%;padding:9px;background:transparent;border:1px solid var(--red);border-radius:var(--radius-sm);color:var(--red);font-size:13px;font-weight:600;font-family:'Sora',sans-serif;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-danger:hover{background:#2d1414}

/* DETAIL VIEW */
.detail-view{display:none;flex-direction:column;gap:12px}
.detail-view.open{display:flex}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;padding:4px 0}
.back-btn i{font-size:16px}

.detail-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.detail-field{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.detail-field:last-child{border:none}
.detail-field-label{color:var(--text2);flex-shrink:0;margin-right:12px}
.detail-field-val{text-align:right;font-weight:500}

/* MSGS TEMPLATE */
.msg-template{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.msg-template:hover{border-color:var(--accent)}
.msg-template-title{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px}
.msg-template-body{font-size:11px;color:var(--text2);line-height:1.5}

/* EMPTY */
.empty{text-align:center;padding:28px 20px;color:var(--text3);font-size:12px}
.empty i{font-size:30px;display:block;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 18px;font-size:12px;font-weight:600;color:var(--text);z-index:500;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.warn{border-color:var(--amber);color:var(--amber)}

/* SEARCH RESULTS */
.search-results{display:flex;flex-direction:column;gap:8px;margin-top:8px}

@media(min-width:600px){body{padding:20px}.app{border-radius:16px;min-height:auto;box-shadow:0 0 0 1px var(--border)}}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo">🏠</div>
    <div class="topbar-info">
      <div class="topbar-title">CRM Corretor</div>
      <div class="topbar-sub" id="today-date"></div>
    </div>
    <button class="topbar-search" onclick="toggleSearch()" title="Busca rápida"><i class="ti ti-search"></i></button>
  </div>

  <!-- GLOBAL SEARCH -->
  <div class="global-search" id="global-search">
    <div class="search-wrap">
      <i class="ti ti-search search-icon"></i>
      <input class="search-input" id="gsearch" type="text" placeholder="Buscar por nome, telefone, empreendimento..." oninput="globalSearch(this.value)" autofocus>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>

  <!-- NAV -->
  <nav class="nav">
    <button class="nav-btn active" onclick="showTab('dashboard',this)"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
    <button class="nav-btn" onclick="showTab('leads',this)"><i class="ti ti-users"></i> Leads</button>
    <button class="nav-btn" onclick="showTab('empreend',this)"><i class="ti ti-building-estate"></i> Produtos</button>
    <button class="nav-btn" onclick="showTab('followup',this)"><i class="ti ti-bell"></i> Follow-up</button>
    <button class="nav-btn" onclick="showTab('msgs',this)"><i class="ti ti-message-2"></i> Mensagens</button>
  </nav>

  <div class="content">

    <!-- DASHBOARD -->
    <div id="tab-dashboard" class="tab active">
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="card">
        <div class="card-title"><div class="card-title-left"><i class="ti ti-filter"></i> Funil de atendimento</div></div>
        <div class="funil" id="funil"></div>
      </div>
      <div id="followup-alerts"></div>
      <div class="card">
        <div class="card-title"><div class="card-title-left"><i class="ti ti-clock"></i> Últimos leads</div></div>
        <div id="dash-leads"></div>
      </div>
    </div>

    <!-- LEADS -->
    <div id="tab-leads" class="tab">
      <!-- Lead Detail View -->
      <div class="detail-view" id="lead-detail">
        <div class="back-btn" onclick="closeLeadDetail()"><i class="ti ti-arrow-left"></i> Voltar aos leads</div>
        <div id="lead-detail-content"></div>
      </div>
      <!-- Lead List View -->
      <div id="lead-list-view">
        <div class="pills" id="lead-pills">
          <button class="pill active" onclick="setLeadF('Todos',this)">Todos</button>
          <button class="pill" onclick="setLeadF('Lead Novo',this)">Novos</button>
          <button class="pill" onclick="setLeadF('Quente',this)">🔥 Quentes</button>
          <button class="pill" onclick="setLeadF('Negociação',this)">Negociação</button>
          <button class="pill" onclick="setLeadF('Perdido',this)">Perdidos</button>
        </div>
        <div class="pills" style="margin-top:6px" id="cat-pills">
          <button class="pill active" onclick="setCatF('Todos',this)">Todos</button>
          <button class="pill" onclick="setCatF('Lançamentos',this)">Lançamentos</button>
          <button class="pill" onclick="setCatF('Prontos',this)">Prontos</button>
          <button class="pill" onclick="setCatF('Locação',this)">Locação</button>
        </div>
        <div id="leads-list" style="display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>

    <!-- EMPREENDIMENTOS -->
    <div id="tab-empreend" class="tab">
      <div class="detail-view" id="emp-detail">
        <div class="back-btn" onclick="closeEmpDetail()"><i class="ti ti-arrow-left"></i> Voltar aos produtos</div>
        <div id="emp-detail-content"></div>
      </div>
      <div id="emp-list-view">
        <div class="pills" id="emp-pills">
          <button class="pill active" onclick="setEmpF('Todos',this)">Todos</button>
          <button class="pill" onclick="setEmpF('Lançamentos',this)">Lançamentos</button>
          <button class="pill" onclick="setEmpF('Prontos',this)">Prontos</button>
          <button class="pill" onclick="setEmpF('Locação',this)">Locação</button>
        </div>
        <div id="emp-list" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </div>

    <!-- FOLLOW-UP -->
    <div id="tab-followup" class="tab">
      <div class="card" style="background:#2d2a14;border-color:#5c4a14">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <i class="ti ti-alert-triangle" style="color:var(--amber);font-size:18px"></i>
          <span style="font-size:13px;font-weight:600;color:var(--amber)">Clientes sem contato há 2+ dias</span>
        </div>
        <div style="font-size:11px;color:var(--text2)">Atualize o status ou registre um contato.</div>
      </div>
      <div id="followup-list" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <!-- MENSAGENS -->
    <div id="tab-msgs" class="tab">
      <div style="font-size:12px;color:var(--text2);padding:2px 0 6px">Toque para copiar e enviar pelo WhatsApp</div>
      <div id="msgs-list"></div>
    </div>

  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()" title="Novo lead / produto"><i class="ti ti-plus"></i></button>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="handleOC(event)">
  <div class="modal" id="modal">
    <div class="modal-title">
      <span id="modal-title-text"></span>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const SK='crm_imob_v3';
let DB={leads:[],empreendimentos:[],contatos:[]};
let leadF='Todos',catF='Todos',empF='Todos',editId=null,curTab='dashboard';

const ETAPAS=['Lead Novo','Primeiro Contato','Qualificação','Proposta Enviada','Visita Agendada','Negociação','Quente','Fechado','Perdido','Sem Interesse'];

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0]}
function daysSince(d){if(!d)return 99;const diff=new Date()-new Date(d);return Math.floor(diff/(1000*60*60*24))}
function fd(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function fmtTel(t){const d=(t||'').replace(/\D/g,'');if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return t}
function ini(n){return(n||'?').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function avc(n){const c=['#4f8ef7','#22c77a','#7c5cfc','#f59e0b','#ef4444','#14b8a6','#ec4899'];return c[(n||'A').charCodeAt(0)%c.length]}
function val(id){return(document.getElementById(id)||{}).value||''}
function valt(id){return((document.getElementById(id)||{}).value||'').trim()}
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',2500)}
function selOpts(arr,cur){return arr.map(o=>`<option${cur===o?' selected':''}>${o}</option>`).join('')}
function waLink(tel,msg=''){const d=(tel||'').replace(/\D/g,'');const num=d.startsWith('55')?d:'55'+d;return`https://wa.me/${num}${msg?'?text='+encodeURIComponent(msg):''}`}

function etapaBadge(e){
  const map={'Lead Novo':'novo','Quente':'quente','Perdido':'perdido','Fechado':'ganho','Sem Interesse':'perdido','Negociação':'neg'};
  const cls=map[e]||'ativo';
  return`<span class="badge ${cls}">${e}</span>`;
}
function origemBadge(o){
  const map={'Instagram Ads':'orig-ig','Facebook Ads':'orig-fb','WhatsApp':'orig-wa','Indicação':'orig-ind','Site':'orig-site','Portal Imobiliário':'orig-portal','Tráfego Pago':'orig-ads','OLX':'orig-olx','Orgânico':'orig-org'};
  const cls=map[o]||'orig-site';
  return`<span class="origem-badge ${cls}">${o||'—'}</span>`;
}
function renderTags(tags){
  if(!tags||!tags.length)return'';
  const map={'🔥 Quente':'quente','💰 Investidor':'investidor','🏠 1ª Compra':'primeira','🏦 Financiamento':'financ','🔄 Permuta':'permuta','⚡ Urgente':'urgente','👑 Alto Padrão':'alto','🔕 Não Respondeu':'sem-resp','🌿 Terreno':'terreno','🏡 Casa Pronta':'casa'};
  return`<div class="tags">${tags.map(t=>`<span class="tag ${map[t]||''}">${t}</span>`).join('')}</div>`;
}

// ─── GLOBAL SEARCH ────────────────────────────────────────────────────────────
function toggleSearch(){
  const el=document.getElementById('global-search');
  el.classList.toggle('open');
  if(el.classList.contains('open'))document.getElementById('gsearch').focus();
  else{document.getElementById('gsearch').value='';document.getElementById('search-results').innerHTML='';}
}
function globalSearch(q){
  const el=document.getElementById('search-results');
  if(!q||q.length<2){el.innerHTML='';return}
  const ql=q.toLowerCase();
  const res=DB.leads.filter(l=>
    l.nome.toLowerCase().includes(ql)||
    (l.tel||'').includes(q)||
    (DB.empreendimentos.find(e=>e.id===l.empId)||{}).nome?.toLowerCase().includes(ql)||
    (l.tags||[]).some(t=>t.toLowerCase().includes(ql))||
    (l.obs||'').toLowerCase().includes(ql)
  ).slice(0,8);
  if(!res.length){el.innerHTML='<div class="empty" style="padding:12px"><i class="ti ti-search-off"></i>Nenhum resultado</div>';return}
  el.innerHTML=res.map(l=>{
    const emp=DB.empreendimentos.find(e=>e.id===l.empId);
    return`<div class="lead-item" onclick="openLeadDetail('${l.id}');toggleSearch()">
      <div class="lead-top">
        <div class="lead-avatar" style="background:${avc(l.nome)}22;color:${avc(l.nome)}">${ini(l.nome)}</div>
        <div class="lead-info">
          <div class="lead-name">${l.nome}</div>
          <div class="lead-detail">${emp?emp.nome:'—'} · ${fmtTel(l.tel)}</div>
        </div>
        ${etapaBadge(l.etapa)}
      </div>
    </div>`;
  }).join('');
}

// ─── LEADS ────────────────────────────────────────────────────────────────────
function setLeadF(f,btn){
  leadF=f;
  if(btn){document.querySelectorAll('#lead-pills .pill').forEach(p=>p.classList.remove('active'));btn.classList.add('active');}
  // switch to leads tab if called from dashboard
  if(curTab==='dashboard'){showTab('leads',document.querySelectorAll('.nav-btn')[1]);}
  renderLeads();
}
function setCatF(f,btn){catF=f;document.querySelectorAll('#cat-pills .pill').forEach(p=>p.classList.remove('active'));btn.classList.add('active');renderLeads()}

function renderLeads(){
  const el=document.getElementById('leads-list');
  if(!el)return;
  let list=DB.leads.filter(l=>{
    const mE=leadF==='Todos'||l.etapa===leadF||(leadF==='Quente'&&(l.etapa==='Quente'||(l.tags||[]).includes('🔥 Quente')));
    const mC=catF==='Todos'||l.categoria===catF;
    return mE&&mC;
  });
  if(!list.length){el.innerHTML='<div class="empty"><i class="ti ti-users-off"></i>Nenhum lead encontrado</div>';return}
  el.innerHTML=list.map(l=>{
    const emp=DB.empreendimentos.find(e=>e.id===l.empId);
    const dias=daysSince(l.ultimoContato);
    return`<div class="lead-item" onclick="openLeadDetail('${l.id}')">
      <div class="lead-top">
        <div class="lead-avatar" style="background:${avc(l.nome)}22;color:${avc(l.nome)}">${ini(l.nome)}</div>
        <div class="lead-info">
          <div class="lead-name">${l.nome}</div>
          <div class="lead-detail">${emp?emp.nome:'—'} · ${fmtTel(l.tel)}</div>
          <div style="margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${etapaBadge(l.etapa)}
            ${origemBadge(l.origem)}
            ${dias>=2?`<span style="font-size:10px;color:var(--amber)">${dias}d sem contato</span>`:''}
          </div>
        </div>
        <div class="lead-actions" onclick="event.stopPropagation()">
          <a class="btn-icon wa" href="${waLink(l.tel)}" target="_blank"><i class="ti ti-brand-whatsapp"></i></a>
          <button class="btn-icon edit" onclick="editLead('${l.id}')"><i class="ti ti-edit"></i></button>
        </div>
      </div>
      ${renderTags(l.tags)}
    </div>`;
  }).join('');
}

// LEAD DETAIL
function openLeadDetail(id){
  const l=DB.leads.find(x=>x.id===id);
  if(!l)return;
  if(curTab!=='leads'){showTab('leads',document.querySelectorAll('.nav-btn')[1]);}
  document.getElementById('lead-list-view').style.display='none';
  const det=document.getElementById('lead-detail');
  det.classList.add('open');
  const emp=DB.empreendimentos.find(e=>e.id===l.empId);
  const hist=DB.contatos.filter(c=>c.leadId===id).sort((a,b)=>b.data.localeCompare(a.data));

  // match suggestions
  const matches=DB.empreendimentos.filter(e=>{
    if(e.id===l.empId)return false;
    if(l.categoria&&e.tipo!==l.categoria)return false;
    if(l.vlMax&&e.vlMin&&+l.vlMax<+e.vlMin)return false;
    if(l.vlMin&&e.vlMax&&+l.vlMin>+e.vlMax)return false;
    return true;
  }).slice(0,3);

  document.getElementById('lead-detail-content').innerHTML=`
    <div class="detail-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <div class="lead-avatar" style="width:46px;height:46px;font-size:16px;border-radius:50%;background:${avc(l.nome)}22;color:${avc(l.nome)}">${ini(l.nome)}</div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:600">${l.nome}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${l.cidade||'—'}</div>
          <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">${etapaBadge(l.etapa)}${origemBadge(l.origem)}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <a class="btn-icon wa" href="${waLink(l.tel)}" target="_blank" style="width:34px;height:34px;font-size:16px"><i class="ti ti-brand-whatsapp"></i></a>
          <button class="btn-icon edit" onclick="editLead('${l.id}')" style="width:34px;height:34px"><i class="ti ti-edit"></i></button>
        </div>
      </div>
      ${renderTags(l.tags)}
      <div style="margin-top:12px">
        <div class="detail-field"><span class="detail-field-label">Telefone</span><span class="detail-field-val"><a href="tel:+55${(l.tel||'').replace(/\D/g,'')}" style="color:var(--accent);text-decoration:none">${fmtTel(l.tel)}</a></span></div>
        <div class="detail-field"><span class="detail-field-label">E-mail</span><span class="detail-field-val">${l.email||'—'}</span></div>
        <div class="detail-field"><span class="detail-field-label">Produto</span><span class="detail-field-val">${emp?emp.nome:'—'}</span></div>
        <div class="detail-field"><span class="detail-field-label">Categoria</span><span class="detail-field-val">${l.categoria||'—'}</span></div>
        <div class="detail-field"><span class="detail-field-label">Faixa de valor</span><span class="detail-field-val">R$ ${(+l.vlMin||0).toLocaleString('pt-BR')} – R$ ${(+l.vlMax||0).toLocaleString('pt-BR')}</span></div>
        <div class="detail-field"><span class="detail-field-label">Origem</span><span class="detail-field-val">${l.origemDetalhe||l.origem||'—'}</span></div>
        <div class="detail-field"><span class="detail-field-label">Último contato</span><span class="detail-field-val">${fd(l.ultimoContato)} (${daysSince(l.ultimoContato)}d atrás)</span></div>
        ${l.obs?`<div class="detail-field" style="flex-direction:column;gap:4px"><span class="detail-field-label">Observações</span><span style="font-size:12px;margin-top:4px;line-height:1.6;color:var(--text)">${l.obs}</span></div>`:''}
      </div>
    </div>

    ${matches.length?`<div class="match-card">
      <div class="match-title"><i class="ti ti-sparkles"></i> Produtos compatíveis com este perfil</div>

function renderEmpreendimentos(){
  const el=document.getElementById('emp-list');
  if(!el)return;
  const list=DB.empreendimentos.filter(e=>empF==='Todos'||e.tipo===empF);
  if(!list.length){el.innerHTML='<div class="empty"><i class="ti ti-building-off"></i>Sem produtos</div>';return}
  el.innerHTML=list.map(e=>{
    const leads=DB.leads.filter(l=>l.empId===e.id);
    const quentes=leads.filter(l=>l.etapa==='Quente'||(l.tags||[]).includes('🔥 Quente')).length;
    const pendentes=leads.filter(l=>daysSince(l.ultimoContato)>=2&&!['Fechado','Perdido','Sem Interesse'].includes(l.etapa)).length;
    const tipoCor=e.tipo==='Lançamentos'?'var(--amber)':e.tipo==='Locação'?'var(--teal)':'var(--accent)';
    return`<div class="emp-card" onclick="openEmpDetail('${e.id}')">
      <div class="emp-header">
        <div>
          <div class="emp-name">${e.nome}</div>
          <div class="emp-tipo" style="color:${tipoCor}">${e.tipo} · ${e.cidade}</div>
        </div>
        <div style="display:flex;gap:4px" onclick="event.stopPropagation()">
          <button class="btn-icon edit" onclick="editEmp('${e.id}')"><i class="ti ti-edit"></i></button>
        </div>
      </div>
      <div class="emp-stats">
        <div class="emp-stat"><div class="emp-stat-val">${leads.length}</div><div class="emp-stat-label">Leads</div></div>
        <div class="emp-stat"><div class="emp-stat-val" style="color:#ff6b6b">${quentes}</div><div class="emp-stat-label">🔥 Quentes</div></div>
        <div class="emp-stat"><div class="emp-stat-val" style="color:var(--amber)">${pendentes}</div><div class="emp-stat-label">Follow-up</div></div>
      </div>
    </div>`;
  }).join('');
}

function openEmpDetail(id){
  const e=DB.empreendimentos.find(x=>x.id===id);
  if(!e)return;
  document.getElementById('emp-list-view').style.display='none';
  document.getElementById('emp-detail').classList.add('open');
  const leads=DB.leads.filter(l=>l.empId===id);
  document.getElementById('emp-detail-content').innerHTML=`
    <div class="detail-card" style="margin-bottom:12px">
      <div style="font-size:16px;font-weight:600;margin-bottom:4px">${e.nome}</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${e.tipo} · ${e.cidade}</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${e.descricao||''}</div>
      <div style="font-size:12px">Faixa: <strong>R$ ${(+e.vlMin||0).toLocaleString('pt-BR')} – R$ ${(+e.vlMax||0).toLocaleString('pt-BR')}</strong></div>
      <button onclick="editEmp('${e.id}')" style="margin-top:12px;background:transparent;border:1px solid var(--accent);border-radius:6px;color:var(--accent);padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Sora',sans-serif">Editar produto</button>
    </div>
    <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">${leads.length} clientes interessados</div>
    ${leads.length?leads.map(l=>`
      <div class="lead-item" style="margin-bottom:8px" onclick="openLeadDetail('${l.id}')">
        <div class="lead-top">
          <div class="lead-avatar" style="width:32px;height:32px;font-size:11px;background:${avc(l.nome)}22;color:${avc(l.nome)}">${ini(l.nome)}</div>
          <div class="lead-info">
            <div class="lead-name">${l.nome}</div>
            <div class="lead-detail">Último contato: ${fd(l.ultimoContato)} · ${daysSince(l.ultimoContato)}d</div>
            <div style="margin-top:3px">${etapaBadge(l.etapa)}</div>
          </div>
          <a class="btn-icon wa" href="${waLink(l.tel)}" target="_blank" onclick="event.stopPropagation()"><i class="ti ti-brand-whatsapp"></i></a>
        </div>
      </div>`).join(''):'<div class="empty"><i class="ti ti-users-off"></i>Sem clientes para este produto</div>'}`;
}
function closeEmpDetail(){
  document.getElementById('emp-list-view').style.display='';
  document.getElementById('emp-detail').classList.remove('open');
}

// ─── FOLLOW-UP ────────────────────────────────────────────────────────────────
function renderFollowup(){
  const el=document.getElementById('followup-list');
  if(!el)return;
  const list=DB.leads
    .filter(l=>daysSince(l.ultimoContato)>=2&&!['Fechado','Perdido','Sem Interesse'].includes(l.etapa))
    .sort((a,b)=>daysSince(b.ultimoContato)-daysSince(a.ultimoContato));
  if(!list.length){el.innerHTML='<div class="empty"><i class="ti ti-checks"></i>Nenhum follow-up pendente!</div>';return}
  el.innerHTML=list.map(l=>{
    const emp=DB.empreendimentos.find(e=>e.id===l.empId);
    const dias=daysSince(l.ultimoContato);
    const urgColor=dias>=5?'var(--red)':dias>=3?'var(--amber)':'var(--text2)';
    return`<div class="lead-item" onclick="openLeadDetail('${l.id}')">
      <div class="lead-top">
        <div class="lead-avatar" style="background:${avc(l.nome)}22;color:${avc(l.nome)}">${ini(l.nome)}</div>
        <div class="lead-info">
          <div class="lead-name">${l.nome}</div>
          <div class="lead-detail">${emp?emp.nome:'—'} · ${etapaBadge(l.etapa)}</div>
          <div style="margin-top:4px;font-size:11px;font-weight:600;color:${urgColor}"><i class="ti ti-clock" style="font-size:12px;vertical-align:-1px"></i> ${dias} dias sem contato</div>
        </div>
        <div class="lead-actions" onclick="event.stopPropagation()">
          <a class="btn-icon wa" href="${waLink(l.tel)}" target="_blank"><i class="ti ti-brand-whatsapp"></i></a>
          <button class="btn-icon edit" onclick="regContato('${l.id}')"><i class="ti ti-check"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function regContato(id){
  const l=DB.leads.find(x=>x.id===id);
  if(!l)return;
  l.ultimoContato=new Date().toISOString().split('T')[0];
  DB.contatos.push({id:uid(),leadId:id,tipo:'Contato Rápido',data:l.ultimoContato,obs:'Marcado como contatado via follow-up.'});
  save();renderAll();toast('Contato registrado!');
}

// ─── MENSAGENS ────────────────────────────────────────────────────────────────
const MSGS=[
  {titulo:'Primeiro contato – Lançamento',body:'Olá, [NOME]! 👋 Vi que você demonstrou interesse em nossos lançamentos. Sou [CORRETOR], especialista em imóveis na região. Posso te passar mais informações sobre o empreendimento? 🏠'},
  {titulo:'Follow-up após 1 dia',body:'Oi, [NOME]! Tudo bem? Passei para ver se você teve a oportunidade de analisar as informações que enviei. Tenho condições especiais disponíveis essa semana. Posso te ajudar? 😊'},
  {titulo:'Reativar lead frio',body:'Olá, [NOME]! Há um tempo não nos falamos. Queria saber se você ainda tem interesse em adquirir seu imóvel. Temos novidades e condições imperdíveis! 🔑'},
  {titulo:'Confirmar visita',body:'Oi, [NOME]! Só confirmando nossa visita para [DATA] às [HORA]. Estou animado para te mostrar o empreendimento pessoalmente! Qualquer dúvida é só chamar. 📍'},
  {titulo:'Envio de proposta',body:'[NOME], preparei uma proposta especial para você! 📋 Confira os valores e condições de pagamento em anexo. Estou à disposição para esclarecer qualquer dúvida. Quando podemos conversar?'},
  {titulo:'Após visita – Quente',body:'[NOME], foi um prazer te receber hoje! 🏡 O que achou do empreendimento? Fico à disposição para qualquer dúvida. Lembre-se que as unidades estão se esgotando rapidamente!'},
  {titulo:'Cliente perdido – Reengajamento',body:'Oi, [NOME]! Soube que ainda está em busca do imóvel ideal. Temos novos produtos que podem se encaixar perfeitamente no seu perfil. Posso te apresentar? 🏠✨'},
  {titulo:'Parabéns pelo fechamento',body:'[NOME], parabéns pela conquista do seu imóvel! 🎉 Foi uma satisfação enorme te ajudar nessa jornada. Qualquer dúvida no processo estarei sempre à disposição!'},
];
function renderMsgs(){
  const el=document.getElementById('msgs-list');
  if(!el)return;
  el.innerHTML=MSGS.map(m=>`
    <div class="msg-template" onclick="copyMsg('${m.titulo}','${btoa(unescape(encodeURIComponent(m.body)))}')">
      <div class="msg-template-title"><i class="ti ti-copy" style="font-size:12px;margin-right:4px"></i>${m.titulo}</div>
      <div class="msg-template-body">${m.body}</div>
    </div>`).join('');
}
function copyMsg(titulo,bodyB64){
  const body=decodeURIComponent(escape(atob(bodyB64)));
  navigator.clipboard.writeText(body).then(()=>toast('Mensagem copiada! Cole no WhatsApp','success')).catch(()=>toast('Erro ao copiar','error'));
}

// ─── CONTATO FORM ─────────────────────────────────────────────────────────────
function addContato(leadId){
  openModal('Registrar Contato',`
    <div class="form-group"><label class="form-label">Tipo de contato</label>
      <select class="form-select" id="ctp">${selOpts(['WhatsApp','Ligação','Visita','Reunião','E-mail','Outro'],'')}</select>
    </div>
    <div class="form-group"><label class="form-label">Data</label><input class="form-input" id="cdt" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="form-group"><label class="form-label">Anotação</label><textarea class="form-textarea" id="cob" placeholder="O que foi discutido? Próximos passos..."></textarea></div>
    <div class="form-group"><label class="form-label">Atualizar etapa do cliente</label>
      <select class="form-select" id="ceta">${selOpts(['(manter atual)',...ETAPAS],'(manter atual)')}</select>
    </div>
    <button class="btn-primary" onclick="saveContato('${leadId}')">Salvar contato</button>`);
}
function saveContato(leadId){
  const l=DB.leads.find(x=>x.id===leadId);
  if(!l)return;
  const dt=val('cdt')||new Date().toISOString().split('T')[0];
  const novaEtapa=val('ceta');
  DB.contatos.push({id:uid(),leadId,tipo:val('ctp'),data:dt,obs:valt('cob')});
  l.ultimoContato=dt;
  if(novaEtapa!=='(manter atual)')l.etapa=novaEtapa;
  save();closeModal();renderAll();toast('Contato registrado!');
  // re-open detail
  setTimeout(()=>openLeadDetail(leadId),100);
}

// ─── LEAD FORM ───────────────────────────────────────────────────────────────
function openLeadForm(id){
  editId=id||null;const l=id?DB.leads.find(x=>x.id===id):{};
  const empOpts=DB.empreendimentos.map(e=>`<option value="${e.id}"${l.empId===e.id?' selected':''}>${e.nome}</option>`).join('');
  const tagHTML=TAGS_LIST.map(t=>`<button type="button" class="tag-opt${(l.tags||[]).includes(t)?' selected':''}" onclick="toggleTag(this,'${t}')">${t}</button>`).join('');
  openModal(id?'Editar Lead':'Novo Lead',`
    <div class="form-section">Dados pessoais</div>
    <div class="form-group"><label class="form-label">Nome *</label><input class="form-input" id="fn" value="${l.nome||''}" placeholder="Nome completo"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">WhatsApp *</label><input class="form-input" id="ft" value="${l.tel||''}" placeholder="(00) 00000-0000"></div>
      <div class="form-group"><label class="form-label">E-mail</label><input class="form-input" id="fe" value="${l.email||''}" placeholder="email@..."></div>
    </div>
    <div class="form-group"><label class="form-label">Cidade</label><input class="form-input" id="fci" value="${l.cidade||''}" placeholder="Cidade"></div>

    <div class="form-section">Perfil de busca</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Categoria</label>
        <select class="form-select" id="fcat">${selOpts(CATEGORIAS,l.categoria)}</select>
      </div>
      <div class="form-group"><label class="form-label">Produto / Empreendimento</label>
        <select class="form-select" id="femp"><option value="">— Selecione —</option>${empOpts}</select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Valor mín (R$)</label><input class="form-input" id="fvmin" type="number" value="${l.vlMin||''}" placeholder="0"></div>
      <div class="form-group"><label class="form-label">Valor máx (R$)</label><input class="form-input" id="fvmax" type="number" value="${l.vlMax||''}" placeholder="0"></div>
    </div>

    <div class="form-section">Origem e etapa</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Origem</label>
        <select class="form-select" id="for">${selOpts(ORIGENS,l.origem)}</select>
      </div>
      <div class="form-group"><label class="form-label">Etapa</label>
        <select class="form-select" id="fet">${selOpts(ETAPAS,l.etapa||'Lead Novo')}</select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Detalhe da origem (anúncio/campanha)</label>
      <input class="form-input" id="fod" value="${l.origemDetalhe||''}" placeholder="Ex: Instagram Ads - Villa Colinas - Vídeo 02"></div>

    <div class="form-section">Tags</div>
    <div class="tag-picker" id="tag-picker">${tagHTML}</div>

    <div class="form-section">Observações</div>
    <div class="form-group"><textarea class="form-textarea" id="fob" placeholder="Interesses, restrições, situação financeira...">${l.obs||''}</textarea></div>

    <button class="btn-primary" onclick="saveLead()">${id?'Salvar alterações':'Adicionar lead'}</button>
    ${id?`<button class="btn-danger" onclick="delLead('${id}',true)">Excluir lead</button>`:''}`);
}

function toggleTag(btn,tag){btn.classList.toggle('selected')}

function saveLead(){
  const nome=valt('fn'),tel=valt('ft');
  if(!nome||!tel){toast('Preencha nome e telefone','error');return}
  const tags=[...document.querySelectorAll('.tag-opt.selected')].map(b=>b.textContent.trim());
  const obj={nome,tel,email:valt('fe'),cidade:valt('fci'),categoria:val('fcat'),empId:val('femp'),vlMin:+val('fvmin')||0,vlMax:+val('fvmax')||0,origem:val('for'),etapa:val('fet'),origemDetalhe:valt('fod'),obs:valt('fob'),tags,ultimoContato:new Date().toISOString().split('T')[0]};
  if(editId){const i=DB.leads.findIndex(x=>x.id===editId);DB.leads[i]={...DB.leads[i],...obj};toast('Lead atualizado!')}
  else{DB.leads.push({id:uid(),...obj});toast('Lead adicionado!')}
  save();closeModal();renderAll();
}
function editLead(id){openLeadForm(id)}
function delLead(id,fromModal=false){if(!confirm('Excluir este lead?'))return;DB.leads=DB.leads.filter(x=>x.id!==id);DB.contatos=DB.contatos.filter(c=>c.leadId!==id);save();if(fromModal)closeModal();closeLeadDetail();renderAll();toast('Lead excluído')}

// ─── EMP FORM ────────────────────────────────────────────────────────────────
function openEmpForm(id){
  editId=id||null;const e=id?DB.empreendimentos.find(x=>x.id===id):{};
  openModal(id?'Editar Produto':'Novo Produto',`
    <div class="form-group"><label class="form-label">Nome *</label><input class="form-input" id="en" value="${e.nome||''}" placeholder="Ex: Lagos do Engenho"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Tipo</label><select class="form-select" id="et">${selOpts(CATEGORIAS,e.tipo)}</select></div>
      <div class="form-group"><label class="form-label">Cidade</label><input class="form-input" id="ec" value="${e.cidade||''}" placeholder="Cidade"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Valor mín (R$)</label><input class="form-input" id="evm" type="number" value="${e.vlMin||''}"></div>
      <div class="form-group"><label class="form-label">Valor máx (R$)</label><input class="form-input" id="evx" type="number" value="${e.vlMax||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Descrição</label><textarea class="form-textarea" id="ed">${e.descricao||''}</textarea></div>
    <button class="btn-primary" onclick="saveEmp()">${id?'Salvar':'Adicionar produto'}</button>
    ${id?`<button class="btn-danger" onclick="delEmp('${id}',true)">Excluir produto</button>`:''}`);
}
function saveEmp(){
  const nome=valt('en');if(!nome){toast('Informe o nome','error');return}
  const obj={nome,tipo:val('et'),cidade:valt('ec'),vlMin:+val('evm')||0,vlMax:+val('evx')||0,descricao:valt('ed'),ativo:true};
  if(editId){const i=DB.empreendimentos.findIndex(x=>x.id===editId);DB.empreendimentos[i]={...DB.empreendimentos[i],...obj};toast('Produto atualizado!')}
  else{DB.empreendimentos.push({id:uid(),...obj});toast('Produto adicionado!')}
  save();closeModal();renderAll();
}
function editEmp(id){openEmpForm(id)}
function delEmp(id,fromModal=false){if(!confirm('Excluir este produto?'))return;DB.empreendimentos=DB.empreendimentos.filter(x=>x.id!==id);save();if(fromModal)closeModal();closeEmpDetail();renderAll();toast('Produto excluído')}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openModal(title,html){document.getElementById('modal-title-text').textContent=title;document.getElementById('modal-body').innerHTML=html;document.getElementById('overlay').classList.add('open')}
function closeModal(){document.getElementById('overlay').classList.remove('open');editId=null}
function handleOC(e){if(e.target===document.getElementById('overlay'))closeModal()}

function openAddModal(){
  if(curTab==='empreend')openEmpForm();
  else openLeadForm();
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────────
function renderAll(){
  renderDashboard();
  renderLeads();
  renderEmpreendimentos();
  renderFollowup();
  renderMsgs();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('today-date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
load();
renderAll();
</script>
</body>
</html>
